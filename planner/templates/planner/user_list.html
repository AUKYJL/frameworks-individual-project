{% extends 'base.html' %}
{% block title %}Пользователи{% endblock %}
{% block content %}
<h1>Пользователи</h1><p class="text-muted">Всего пользователей: {{ users|length }}</p>
<div class="list-group shadow-sm">
{% for user in users %}
  <a class="list-group-item list-group-item-action entity-item p-3" href="{% url 'planner:user_detail' user.id %}">
    <span class="fw-semibold">{{ user.name|default:'Без имени' }}</span>
    <span class="d-block text-muted small">{{ user.email }}</span>
  </a>
{% empty %}<p class="list-group-item">Пользователей пока нет.</p>{% endfor %}
</div>
{% endblock %}
