<article class="card entity-card task-card h-100 shadow-sm">
  <div class="card-body d-flex flex-column">
    <div class="d-flex align-items-start justify-content-between gap-2 mb-2">
      <span class="muted-label">Задача №{{ entry.task.id }}</span>
      {% include 'planner/includes/task_status.html' with task=entry.task %}
    </div>
    <h2 class="h5 value">{{ entry.task.title|default:'Без названия' }}</h2>
    <p class="text-muted small mb-3">{{ entry.user.name }} · {{ entry.category.name|capfirst }}</p>
    <a class="btn btn-outline-primary btn-sm mt-auto align-self-start" href="{% url 'planner:task_detail' entry.task.id %}">Подробнее</a>
  </div>
</article>
