{% load static %}
<header class="site-header bg-white border-bottom mb-4">
  <nav class="container navbar navbar-expand-lg flex-wrap gap-2" aria-label="Главная навигация">
    <a class="navbar-brand brand" href="{% url 'homepage:index' %}">
      <img src="{% static 'homepage/img/logo.svg' %}" alt="Логотип Reminderly" width="36" height="36">
      Reminderly
    </a>
    <div class="d-flex flex-wrap gap-1 ms-lg-auto">
      <a class="nav-link {% if request.resolver_match.namespace == 'homepage' %}active{% endif %}"
         href="{% url 'homepage:index' %}">Главная</a>
      <a class="nav-link {% if request.resolver_match.url_name == 'reminder_list' or request.resolver_match.url_name == 'reminder_detail' %}active{% endif %}"
         href="{% url 'planner:reminder_list' %}">Напоминания</a>
      <a class="nav-link {% if request.resolver_match.url_name == 'task_list' or request.resolver_match.url_name == 'task_detail' %}active{% endif %}"
         href="{% url 'planner:task_list' %}">Задачи</a>
      <a class="nav-link {% if request.resolver_match.url_name == 'category_list' or request.resolver_match.url_name == 'category_detail' %}active{% endif %}"
         href="{% url 'planner:category_list' %}">Категории</a>
      <a class="nav-link {% if request.resolver_match.url_name == 'user_list' or request.resolver_match.url_name == 'user_detail' %}active{% endif %}"
         href="{% url 'planner:user_list' %}">Пользователи</a>
      <a class="nav-link {% if request.resolver_match.url_name == 'time_list' or request.resolver_match.url_name == 'time_detail' %}active{% endif %}"
         href="{% url 'planner:time_list' %}">Время</a>
    </div>
  </nav>
</header>
