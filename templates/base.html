{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Reminderly — учебный сервис напоминаний">
  <title>{% block title %}Reminderly{% endblock %} · Сервис напоминаний</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{% static 'homepage/css/style.css' %}">
</head>
<body>
  {% include 'includes/navigation.html' %}
  <main class="container main-content pb-5">
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{{ message.tags|default:'info' }}" role="status">{{ message }}</div>
      {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer border-top py-3 text-center text-muted small">
    © <span id="current-year">2026</span> Reminderly · ПР7 · Django Templates + SQLite CRUD
  </footer>
  <script src="{% static 'homepage/js/main.js' %}"></script>
</body>
</html>
